<!doctype html>
<!-- Generated from src/photos.html by scripts/build-html.mjs. Do not edit. -->
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="Niklas Braun" />
    <meta name="theme-color" content="#f8efe7" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}" />
    <link rel="canonical" href="{{url}}" />
    <link rel="alternate" hreflang="en" href="{{enUrl}}" />
    <link rel="alternate" hreflang="de" href="{{deUrl}}" />
    <link rel="alternate" hreflang="x-default" href="{{enUrl}}" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23171717'/%3E%3Ctext x='50' y='72' font-family='Arial' font-size='64' fill='%23f7f7f4' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/dist/tailwind.css" />
    <script>
      // Set the theme before first paint, so a stored dark choice does not flash light.
      (() => {
        let stored;
        try { stored = localStorage.getItem("theme"); } catch {}
        document.documentElement.dataset.theme = ["dark", "light"].includes(stored)
          ? stored
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#photos">{{t:photos.skip}}</a>
    <div class="top-bar" aria-hidden="true"></div>
    <div class="page photos-page">
      <!-- ==================== HEADER ==================== -->
      <header class="site-header">
        <a class="site-name" href="{{homePath}}" aria-label="{{t:nav.home}}">Niklas Braun</a>
        <div class="header-controls">
          <nav class="switch language-switch" aria-label="{{t:nav.language}}">
            <a href="{{enPath}}" hreflang="en" lang="en"{{enCurrent}}>EN</a>
            <a href="{{dePath}}" hreflang="de" lang="de"{{deCurrent}}>DE</a>
          </nav>
          <div class="switch theme-switch" role="group" aria-label="{{t:nav.theme}}">
            <button type="button" data-theme-choice="light" aria-pressed="false" aria-label="{{t:theme.light}}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="{{t:theme.dark}}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
            </button>
          </div>
        </div>
      </header>
      <!-- ==================== PHOTOS ==================== -->
      <main class="photos-main" id="photos">
        <h1 class="photos-title">{{heading}}</h1>
        {{content}}
      </main>
      <!-- ==================== FOOTER ==================== -->
      <footer class="site-footer">
        <span>© {{year}} Niklas Braun</span>
        <a href="{{backPath}}">{{backLabel}}</a>
      </footer>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const root = document.documentElement;
        // The head script already set data-theme; this keeps controls and the browser chrome in sync.
        function applyTheme(theme, store = false) {
          root.dataset.theme = theme;
          document.querySelectorAll("[data-theme-choice]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme)));
          document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(root).getPropertyValue("--c-bg").trim());
          if (store) try { localStorage.setItem("theme", theme); } catch {}
        }
        document.querySelectorAll("[data-theme-choice]").forEach((button) => button.addEventListener("click", () => applyTheme(button.dataset.themeChoice, true)));
        applyTheme(root.dataset.theme === "dark" ? "dark" : "light");
      });
    </script>
  </body>
</html>
